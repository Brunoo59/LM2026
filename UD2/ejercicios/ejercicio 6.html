   <h1> Galicia</h1>
   <h2>Galiza</h2>
    <p>Los nombres <strong>Galiza</strong> y Galicia derivan de la palabra latina Gallaecia (o Callaecia), que literalmente significaba tierra de los galaicos. Los galaicos eran el pueblo más numeroso del noroeste de la Península Ibérica ya antes de su integración en el Imperio Romano en el siglo I a.C.</p>
